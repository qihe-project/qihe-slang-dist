name: Release slang f31d20e

on:
  workflow_dispatch:

env:
  SLANG_REPOSITORY: MikePopoloski/slang
  SLANG_REF: f31d20e5574773e9ebe46bba95efa395966ce5e9
  RELEASE_TAG: f31d20e
  RELEASE_NAME: slang f31d20e

jobs:
  linux:
    name: Linux (x86_64, manylinux_2_28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SLANG_REPOSITORY }}
          ref: ${{ env.SLANG_REF }}
          path: slang
          fetch-depth: 0
      - name: Build
        working-directory: slang
        run: |
          git config --system --add safe.directory '*'
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE \
            -DSLANG_INCLUDE_TESTS=OFF
          cmake --build build --target slang_driver -j4
      - name: Package
        working-directory: slang
        run: |
          mkdir -p dist
          tar -czvf dist/slang-linux-x86_64.tar.gz -C build/bin slang
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-linux
          path: slang/dist/slang-linux-x86_64.tar.gz

  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SLANG_REPOSITORY }}
          ref: ${{ env.SLANG_REF }}
          path: slang
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"
      - name: Configure
        working-directory: slang
        run: |
          cmake --preset macos-release \
            -DSLANG_INCLUDE_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        working-directory: slang
        run: |
          cmake --build build/macos-release --target slang_driver -j4
      - name: Package
        working-directory: slang
        run: |
          mkdir -p dist
          tar -czvf dist/slang-macos-arm64.tar.gz -C build/macos-release/bin slang
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-macos
          path: slang/dist/slang-macos-arm64.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SLANG_REPOSITORY }}
          ref: ${{ env.SLANG_REF }}
          path: slang
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        working-directory: slang
        run: |
          cmake --preset win64-release `
            -DSLANG_INCLUDE_TESTS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        working-directory: slang
        run: |
          cmake --build build/win64-release --target slang_driver -j4
      - name: Package
        working-directory: slang
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/win64-release/bin/slang.exe -DestinationPath dist/slang-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-windows
          path: slang/dist/slang-windows-x86_64.zip

  upload:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          draft: true
          body: |
            Built from MikePopoloski/slang@${{ env.SLANG_REF }}.
          overwrite_files: true
          make_latest: false
          files: |
            dist/slang-linux-x86_64.tar.gz
            dist/slang-macos-arm64.tar.gz
            dist/slang-windows-x86_64.zip
